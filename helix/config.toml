[editor]
bufferline = "multiple"
color-modes = true
completion-replace = true
cursorline = true
end-of-line-diagnostics = "hint"
# evil = false
indent-heuristic = "tree-sitter"
line-number = "relative"
mouse = false
popup-border = "all"
rainbow-brackets = true
rulers = [80]
shell = ["/home/apd/.cargo/bin/nu", "-c"]
text-width = 80
trim-trailing-whitespace = true
true-color = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-inlay-hints = true

[editor.soft-wrap]
enable = true
wrap-at-text-width = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.whitespace]
render = "all"

[editor.whitespace.characters]
newline = "⏎"
nbsp = "⍽"
nnbsp = "␣"
space = "·"
tab = "→"
tabpad = "·"

[editor.file-picker]
hidden = false

[editor.indent-guides]
character = "╎"
render = false
skip-levels = 0

[keys.normal."+"]
f = ":format"
w = ":toggle whitespace.render all"
W = ":set whitespace.render none"
s = ":toggle soft-wrap.enable"

[keys.normal."="]
"=" = ":format"

[editor.statusline]
left = [
  "mode",
  "spinner",
  "version-control",
  "spacer",
  "separator",
  "file-name",
  "read-only-indicator",
  "spacer",
]
center = [
  "spacer",
  "spacer",
  "spacer",
  "spacer",
  "position-percentage",
  "spacer",
  "position",
  "total-line-numbers",
]
right = [
  "diagnostics",
  "workspace-diagnostics",
  "file-encoding",
  "file-modification-indicator",
  "file-line-ending",
  "register",
  "selections",
  "file-type",
]
separator = "✫"
mode.normal = "NOR"
mode.insert = "INS"
mode.select = "SEL"

[keys.normal]
D = ["ensure_selections_forward", "extend_to_line_end", "delete_selection"]
0 = "goto_line_start"
"$" = "goto_line_end"
"^" = "goto_first_nonwhitespace"
G = "goto_file_end"
V = ["select_mode", "extend_to_line_bounds"]
esc = ["collapse_selection", "keep_primary_selection"]
"C-[" = ["collapse_selection", "keep_primary_selection"]
"C-/" = "toggle_comments"

C-o = ":config-open"
C-r = ":config-reload"

C-y = [
  ':sh $env.TEMP_PATH | path join $env.HX_TEMP_FILE | rm -f $in',
  ':insert-output yazi ...%{buffer_name} --chooser-file=%sh{ $env.TEMP_PATH | path join $env.HX_TEMP_FILE }',
  ":open %sh{ $env.TEMP_PATH | path join $env.HX_TEMP_FILE | cat $in }",
  ':redraw'
]

# Some nice Helix stuff
C-h = "select_prev_sibling"
C-j = "shrink_selection"
C-k = "expand_selection"
C-l = "select_next_sibling"

# lazygit
C-s = [":new", ":insert-output lazygit", ":buffer-close!", ":redraw", ":reload-all"]

[keys.normal.space]
e = { w = ":write", c = ":bc", x = ":bco", l = ":toggle lsp.display-inlay-hints" }
q = ":quit"

[keys.normal.space.f]
f = "file_picker_in_current_directory"
F = "file_picker"
b = "file_picker_in_current_buffer_directory"
"." = ":toggle-option file-picker.git-ignore"
g = "global_search"
e = "file_explorer"
r = ":reload-all"
x = ":reset-diff-change"
d = [":vsplit-new", ":lang diff", ":insert-output git diff"]

[keys.insert.k]
j = "normal_mode"

[keys.insert]
esc = ["collapse_selection", "keep_primary_selection", "normal_mode"]
"C-["= ["collapse_selection", "keep_primary_selection", "normal_mode"]

[keys.select]
0 = "goto_line_start"
"$" = "goto_line_end"
"^" = "goto_first_nonwhitespace"
G = "goto_file_end"
D = ["extend_to_line_bounds", "delete_selection", "normal_mode"]
k = ["extend_line_up", "extend_to_line_bounds"]
j = ["extend_line_down", "extend_to_line_bounds"]
up = ["extend_line_up", "extend_to_line_bounds"]
down = ["extend_line_down", "extend_to_line_bounds"]

[keys.select.space.f]
s = ":reflow 100"

[editor.auto-save]
after-delay.enable = true
after-delay.timeout = 300000
focus-lost = true
